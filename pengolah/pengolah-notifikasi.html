<script>
/**
 * pengolah-notifikasi.html — Notification page (Supabase-backed, realtime)
 *
 * Data source : waste_provider table (status = 'incoming', target_role_id = roleId)
 * Location    : joined via profiles.role_id → profiles.location_name
 * Read state  : localStorage keys  notif_read_<id>
 * Realtime    : Supabase channel subscription untuk INSERT & UPDATE pada waste_provider
 */

/* ─── Module-level state ──────────────────────────────────────── */
let NOTIFS       = [];   // array of enriched notification objects
let activeFilter = 'semua';
let roleId       = null;
let realtimeChannel = null;

/* ─── localStorage helpers ───────────────────────────────────── */
const LS_KEY = (id) => `notif_read_${id}`;

function isRead(id) {
  return localStorage.getItem(LS_KEY(id)) === '1';
}

function setRead(id) {
  localStorage.setItem(LS_KEY(id), '1');
}

/* ─── Relative time formatter ────────────────────────────────── */
function timeAgo(dateString) {
  if (!dateString) return '—';
  const now  = new Date();
  const date = new Date(dateString);
  const diff = Math.floor((now - date) / 1000); // seconds

  if (diff < 60)            return `${diff} detik lalu`;
  if (diff < 3600)          return `${Math.floor(diff / 60)} menit lalu`;
  if (diff < 86400)         return `${Math.floor(diff / 3600)} jam lalu`;

  const days = Math.floor(diff / 86400);
  if (days === 1)           return `Kemarin, ${date.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`;
  if (days < 7)             return `${days} hari lalu`;

  return date.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
}

/* ─── Notification icon (incoming supply) ───────────────────── */
const SUPPLY_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`;
const SUPPLY_ICON_BG = 'background:var(--accent-orange-soft,#FFF3E0);color:var(--accent-orange,#E65100)';

/* ─── Fetch notifications from Supabase ─────────────────────── */
async function fetchNotifications() {
  try {
    const sb = await getSupabase();

    // 1. Fetch incoming waste_provider rows targeted at this pengolah
    const { data: rows, error: rowErr } = await sb
      .from('waste_provider')
      .select('id, source_role_id, bin_id, weight_kg, status, updated_at')
      .eq('target_role_id', roleId)
      .eq('status', 'incoming')
      .order('updated_at', { ascending: false });

    if (rowErr) throw rowErr;
    if (!rows || rows.length === 0) {
      NOTIFS = [];
      renderNotifs();
      return;
    }

    // 2. Collect unique source_role_ids to resolve location_name via profiles
    const sourceRoleIds = [...new Set(rows.map(r => r.source_role_id))];

    const { data: profiles, error: profErr } = await sb
      .from('profiles')
      .select('role_id, organization')
      .in('role_id', sourceRoleIds);

    if (profErr) throw profErr;

    // 3. Build lookup map: source_role_id → location_name
    const locationMap = {};
    (profiles || []).forEach(p => {
      locationMap[p.role_id] = p.organization || p.role_id;
    });

    // 4. Enrich rows into notification objects
    NOTIFS = rows.map(row => ({
      id:          row.id,
      source:      row.source_role_id,
      bin:         row.bin_id,
      weight:      row.weight_kg,
      location:    locationMap[row.source_role_id] || row.source_role_id,
      updatedAt:   row.updated_at,
      // read state is managed client-side via localStorage
      get read()  { return isRead(this.id); },
    }));

    renderNotifs();

  } catch (err) {
    console.error('[notifikasi] fetchNotifications error:', err);
    showError('Gagal memuat notifikasi. Silakan muat ulang halaman.');
  }
}

/* ─── Render ─────────────────────────────────────────────────── */
function renderNotifs() {
  // Remove loading indicator on first render
  const loading = document.getElementById('notif-loading');
  if (loading) loading.remove();

  const list = document.getElementById('notif-list');

  const filtered = NOTIFS.filter(n => {
    if (activeFilter === 'belum')  return !n.read;
    if (activeFilter === 'dibaca') return  n.read;
    return true; // 'semua'
  });

  if (filtered.length === 0) {
    list.innerHTML = `
      <div style="padding:var(--space-8);text-align:center;color:var(--text-muted);">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             style="margin:0 auto var(--space-3);display:block;opacity:0.4;">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <div style="font-size:var(--font-size-sm);">Tidak ada notifikasi</div>
      </div>`;
  } else {
    list.innerHTML = filtered.map(n => `
      <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}" onclick="markRead('${n.id}')">
        <div class="notif-dot-col">
          ${n.read
            ? '<div style="width:8px;"></div>'
            : '<div class="notif-unread-dot"></div>'}
        </div>
        <div class="notif-icon-col" style="${SUPPLY_ICON_BG};">${SUPPLY_ICON}</div>
        <div class="notif-body">
          <div class="notif-title">Pasokan Baru Masuk</div>
          <div class="notif-desc">
            Provider: ${escHtml(n.source)}<br>
            Bin: ${escHtml(String(n.bin || '—'))}<br>
            Lokasi: ${escHtml(n.location)}<br>
            Berat: ${escHtml(String(n.weight || 0))} kg
          </div>
        </div>
        <div class="notif-time-col">${timeAgo(n.updatedAt)}</div>
      </div>
    `).join('');
  }

  // Footer count
  document.getElementById('notif-count-text').textContent =
    `Menampilkan ${filtered.length} dari ${NOTIFS.length} notifikasi`;

  // Sync badges
  updateNotificationBadge();
}

/* ─── Public badge updater (can be called from navbar/sidebar) ─ */
function updateNotificationBadge() {
  const unreadCount = NOTIFS.filter(n => !n.read).length;

  // Sidebar badge
  const sidebarBadge = document.getElementById('sidebar-notif-badge');
  if (sidebarBadge) {
    sidebarBadge.textContent = unreadCount > 0 ? unreadCount : '';
    sidebarBadge.style.display = unreadCount > 0 ? '' : 'none';
  }

  // Tab badge
  const tabBadge = document.getElementById('tab-unread-badge');
  if (tabBadge) {
    tabBadge.textContent = unreadCount > 0 ? unreadCount : '';
    tabBadge.style.display = unreadCount > 0 ? '' : 'none';
  }
}

/* ─── Filter tabs ────────────────────────────────────────────── */
function filterNotif(btn, tab) {
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = tab;
  renderNotifs();
}

/* ─── Mark single notification as read ──────────────────────── */
function markRead(id) {
  setRead(id);
  renderNotifs();
}

/* ─── Mark all currently visible notifications as read ──────── */
function markAllRead() {
  // Only mark the ones currently matching the active filter
  const toMark = NOTIFS.filter(n => {
    if (activeFilter === 'belum')  return !n.read;
    if (activeFilter === 'dibaca') return  n.read;
    return true;
  });
  toMark.forEach(n => setRead(n.id));
  renderNotifs();
}

/* ─── Realtime subscription ──────────────────────────────────── */
async function subscribeRealtime() {
  const sb = await getSupabase();

  // Bersihkan channel lama sebelum subscribe ulang
  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  realtimeChannel = sb
    .channel('waste-provider-incoming')
    .on(
      'postgres_changes',
      {
        event:  '*',          // Tangkap INSERT dan UPDATE
        schema: 'public',
        table:  'waste_provider',
        filter: `target_role_id=eq.${roleId}`,
      },
      (payload) => {
        // Hanya refresh jika record baru/terupdate memiliki status 'incoming'
        if (payload.new && payload.new.status === 'incoming') {
          // Reload full list untuk resolve location_name via profiles join
          fetchNotifications();
        }
        // Jika status bukan 'incoming', abaikan
      }
    )
    .subscribe();
}

/* ─── Error helper ───────────────────────────────────────────── */
function showError(msg) {
  const loading = document.getElementById('notif-loading');
  if (loading) loading.remove();

  const list = document.getElementById('notif-list');
  list.innerHTML = `
    <div style="padding:var(--space-8);text-align:center;color:var(--text-muted);">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           style="margin:0 auto var(--space-3);display:block;opacity:0.4;">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div style="font-size:var(--font-size-sm);">${escHtml(msg)}</div>
    </div>`;
  document.getElementById('notif-count-text').textContent = '';
}

/* ─── HTML escape ────────────────────────────────────────────── */
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ─── Bootstrap ──────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', async () => {
  try {
    // Retrieve authenticated user context via role-check.js
    const ctx = await getUserContext();
    roleId = ctx.roleId; // e.g. "PRC001"

    if (!roleId) {
      showError('Gagal mendapatkan identitas pengguna.');
      return;
    }

    await fetchNotifications();
    subscribeRealtime();

  } catch (err) {
    console.error('[notifikasi] bootstrap error:', err);
    showError('Terjadi kesalahan saat memuat halaman.');
  }
});
</script>
