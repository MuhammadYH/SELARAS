document.addEventListener('DOMContentLoaded', async () => {
  const context = await getUserContext();

  if (!context) {
    console.error('[ROLE CHECK] User context tidak ditemukan');
    return;
  }

  console.log('[ROLE CHECK]', {
    userId: context.userId,
    role: context.role,
    roleId: context.roleId
  });
});
