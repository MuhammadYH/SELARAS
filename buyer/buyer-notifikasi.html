  <style>
    .notif-tabs-bar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--gray-100);flex-wrap:wrap;gap:var(--space-3);}
    .notif-tabs-bar .buyer-tabs{margin-bottom:0;border-bottom:none;flex-shrink:0;}
    .notif-mark-all{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-xs);font-weight:600;color:var(--primary-green);cursor:pointer;padding:6px var(--space-3);border-radius:var(--radius-md);border:1px solid var(--primary-green-bg);background:var(--primary-green-bg);transition:background .15s;}
    .notif-mark-all:hover{background:#C8E6C9;}
    .notif-list-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-6);background:var(--gray-50);border-bottom:1px solid var(--gray-100);font-size:var(--text-xs);font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;}
    .notif-list{display:flex;flex-direction:column;}
    .notif-item{display:flex;align-items:flex-start;gap:var(--space-4);padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--gray-100);transition:background .15s;cursor:pointer;position:relative;}
    .notif-item:last-child{border-bottom:none;}
    .notif-item:hover{background:var(--gray-50);}
    .notif-item.unread{background:#F0FDF4;}
    .notif-item.unread::before{content:'';position:absolute;left:var(--space-3);top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--primary-green);}
    .notif-icon-wrap{width:40px;height:40px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
    .notif-icon-order{background:#DBEAFE;color:#1D4ED8;}
    .notif-icon-promo{background:#FEF3C7;color:#B45309;}
    .notif-icon-system{background:var(--gray-100);color:var(--gray-600);}
    .notif-icon-success{background:#D1FAE5;color:#065F46;}
    .notif-icon-warning{background:#FEE2E2;color:#991B1B;}
    .notif-body{flex:1;min-width:0;}
    .notif-title{font-size:var(--text-sm);font-weight:600;color:var(--gray-800);margin-bottom:3px;}
    .notif-item.unread .notif-title{color:var(--primary-green-dark);}
    .notif-desc{font-size:var(--text-xs);color:var(--gray-600);line-height:1.5;}
    .notif-time{font-size:var(--text-xs);color:var(--gray-400);white-space:nowrap;flex-shrink:0;}
    .notif-footer{padding:var(--space-4) var(--space-6);border-top:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;}
    .notif-count-text{font-size:var(--text-sm);color:var(--gray-500);}
    @media(max-width:600px){.notif-item{padding:var(--space-4);}.notif-item.unread::before{left:var(--space-2);}}
  </style>
</head>

<script>
(function(){
  const ICONS={
    order:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
    promo:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
    success:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
    warning:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    system:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  };
  let DATA=[
    {id:1,type:'order',iconClass:'notif-icon-order',title:'Pesanan Sedang Dikirim',desc:'Pesanan PRS-2025-001 telah diambil kurir JNE dan sedang dalam perjalanan ke alamatmu.',time:'2 jam lalu',read:false},
    {id:2,type:'promo',iconClass:'notif-icon-promo',title:'Promo Flash Sale! Diskon 20%',desc:'Dapatkan diskon 20% untuk semua produk kompos hari ini. Berlaku hingga pukul 23:59.',time:'5 jam lalu',read:false},
    {id:3,type:'success',iconClass:'notif-icon-success',title:'Pembayaran Berhasil Dikonfirmasi',desc:'Pembayaran untuk pesanan PRS-2025-002 senilai Rp 75.000 telah berhasil dikonfirmasi.',time:'1 hari lalu',read:true},
    {id:4,type:'order',iconClass:'notif-icon-order',title:'Pesanan Siap Dikirim',desc:'Pesanan PRS-2025-002 (Biochar Tanah Subur) sedang disiapkan oleh Pondok Nurul Huda.',time:'1 hari lalu',read:true},
    {id:5,type:'system',iconClass:'notif-icon-system',title:'Verifikasi Alamat Pengiriman',desc:'Alamat pengiriman kamu berhasil diverifikasi dan siap digunakan untuk transaksi berikutnya.',time:'3 hari lalu',read:true},
    {id:6,type:'warning',iconClass:'notif-icon-warning',title:'Stok Produk Favoritmu Hampir Habis',desc:'Kompos Premium Organik dari Darul Ulum tinggal tersisa 5 kg. Segera beli sebelum kehabisan!',time:'4 hari lalu',read:true},
    {id:7,type:'promo',iconClass:'notif-icon-promo',title:'Produk Baru dari Pondok Al Falah',desc:'Media Tanam Steril kini hadir dengan kemasan baru dan harga lebih terjangkau. Cek sekarang!',time:'5 hari lalu',read:true},
  ];
  let activeTab='semua';

  function getFiltered(){
    if(activeTab==='belum') return DATA.filter(n=>!n.read);
    if(activeTab==='dibaca') return DATA.filter(n=>n.read);
    return DATA;
  }

  function render(){
    const list=getFiltered();
    const unreadCount=DATA.filter(n=>!n.read).length;
    document.getElementById('sidebar-notif-badge').textContent=unreadCount;
    document.getElementById('sidebar-notif-badge').style.display=unreadCount?'':'none';
    document.getElementById('notifCountText').textContent=`Menampilkan ${list.length} dari ${DATA.length} notifikasi`;
    const container=document.getElementById('notifList');
    if(!list.length){
      container.innerHTML=`<div class="empty-state" style="padding:var(--space-12) var(--space-6);"><div class="empty-state-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div><h3>Tidak ada notifikasi</h3><p>Semua notifikasi sudah dibaca.</p></div>`;
      return;
    }
    container.innerHTML=list.map(n=>`
      <div class="notif-item ${n.read?'':'unread'}" data-id="${n.id}" onclick="markRead(${n.id})">
        <div class="notif-icon-wrap ${n.iconClass}">${ICONS[n.type]||ICONS.system}</div>
        <div class="notif-body">
          <div class="notif-title">${n.title}${!n.read?'<span class="badge badge-green" style="margin-left:var(--space-2);font-size:10px;">Baru</span>':''}</div>
          <div class="notif-desc">${n.desc}</div>
        </div>
        <div class="notif-time">${n.time}</div>
      </div>`).join('');
  }

  window.markRead=function(id){
    const item=DATA.find(n=>n.id===id);
    if(item) item.read=true;
    render();
  };

  document.getElementById('btnMarkAll').addEventListener('click',()=>{
    DATA.forEach(n=>n.read=true);
    render();
  });

  document.querySelectorAll('.buyer-tab[data-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.buyer-tab[data-tab]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeTab=btn.dataset.tab;
      render();
    });
  });

  render();
})();
</script>
